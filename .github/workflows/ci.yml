# AgentComputerUse CI: the test suite, mypy and ruff on every push / PR to main.
# No secrets and nothing touches a real screen: the tests use stand-ins for Windows, the screen and the mouse.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install mypy and ruff
        run: python -m pip install mypy==2.4.1 types-pynput ruff==0.17.4

      - name: Run tests
        run: python -m pytest -q tests

      # Type-check the whole codebase with the repo's mypy.ini; any error fails the run.
      - name: Run mypy
        run: python -m mypy

      # Lint with ruff.toml (ruff's default rules, with the deliberate exceptions listed there).
      - name: Run ruff
        run: python -m ruff check .
